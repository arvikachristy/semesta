name: Check and build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Print formatted changes
        run: |
          for file in README.md src/app.tsx src/features/canary/use-dev-mode.ts; do
            echo "BEGIN_PRETTIER:$file"
            cat "$file"
            echo "END_PRETTIER:$file"
          done
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: semesta-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
