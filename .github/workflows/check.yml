name: Check and build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Print formatted bucket-list test
        run: |
          echo BEGIN_PRETTIER:src/components/country-selector.spec.tsx
          cat src/components/country-selector.spec.tsx
          echo END_PRETTIER:src/components/country-selector.spec.tsx
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: semesta-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
